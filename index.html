<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#667; --card:#f6f7f9; --line:#e3e5e8; --accent:#0b6e4f; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e8eaed; --muted:#9aa0a6; --card:#1e2126; --line:#2c3038; --accent:#4cc38a; --bad:#f28b82; }
  }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.45 -apple-system,system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px; align-items:baseline }
  h1 { font-size:18px; margin:0 12px 0 0 }
  .muted { color:var(--muted); font-size:13px }
  #controls { display:flex; flex-wrap:wrap; gap:8px; padding:12px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2 }
  select,input[type=number] { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px }
  label.chk { font-size:13px; display:flex; align-items:center; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; padding:16px 20px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column }
  .card img { width:100%; height:180px; object-fit:cover; background:var(--line) }
  .card .b { padding:10px 12px; display:flex; flex-direction:column; gap:6px; flex:1 }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:8px }
  .price { font-weight:700; font-size:17px }
  .score { font-weight:700; padding:2px 8px; border-radius:999px; background:var(--accent); color:#fff; font-size:13px }
  .score.low { background:var(--muted) }
  .t { font-weight:600 } a { color:inherit; text-decoration:none } a:hover .t { text-decoration:underline }
  .tags { display:flex; flex-wrap:wrap; gap:4px; font-size:12px; color:var(--muted) }
  .tag { border:1px solid var(--line); border-radius:6px; padding:1px 6px }
  .tag.mark { border-color:var(--accent); color:var(--accent); font-weight:600 }
  .tag.gone { border-color:var(--bad); color:var(--bad) }
  .reasons { font-size:12px; color:var(--muted); display:none; margin:4px 0 0; padding-left:16px }
  .card.open .reasons { display:block }
  .foot { display:flex; gap:10px; font-size:12px; color:var(--muted); margin-top:auto; padding-top:6px; border-top:1px dashed var(--line) }
  .foot button { background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:0; text-decoration:underline }
  .note { font-size:12px; font-style:italic; color:var(--accent) }
</style>
</head>

  const tags = [
    l.kind === 'house' ? '🏠 house' : '',
    l.rooms ? l.rooms + ' rooms' : '', l.m2 ? l.m2 + ' m²' : '',
    l.floor != null ? 'floor ' + l.floor + (l.total_floors ? '/' + l.total_floors : '') : '',
    l.heating || '', l.parking ? 'parking' : '', l.elevator ? 'lift' : '',
    l.new_build ? 'new build' : '', l.registered ? 'uknjižen' : '',
    l.address || '', 'seen ' + (l.first_seen || '?'),
  ].filter(Boolean).map(t => `<span class="tag">${t}</span>`);
  if (l._mark.status) tags.unshift(`<span class="tag mark">${MARKS[l._mark.status] || l._mark.status}</span>`);
  if (l.active === false) tags.unshift('<span class="tag gone">delisted</span>');
  const map = l.lat ? ` · <a href="https://maps.google.com/?q=${l.lat},${l.lng}" target="_blank">map</a>` : '';
  const dup = (l.also_on || []).map(u => ` · <a href="${u}" target="_blank">dup</a>`).join('');
  return `<div class="card" id="${l.id}">
    ${l.image ? `<a href="${l.url}" target="_blank"><img loading="lazy" src="${l.image}"></a>` : ''}
    <div class="b">
      <div class="row"><span class="price">${fmt(l.price)}</span>
        <span class="score ${ (l.score||0) < 60 ? 'low':'' }">${l.score ?? '–'}</span></div>
      <a href="${l.url}" target="_blank"><span class="t">${(l.title||'').slice(0,80)}</span></a>
      <div class="muted">${l.neighborhood || ''} · ${p2}</div>
      <div class="tags">${tags.join('')}</div>
      ${l._mark.note ? `<div class="note">📝 ${l._mark.note}</div>` : ''}
      <ul class="reasons">${(l.score_reasons||[]).map(r=>`<li>${r}</li>`).join('')}</ul>
      <div class="foot">
        <button onclick="this.closest('.card').classList.toggle('open')">why this score?</button>
        <button onclick="navigator.clipboard.writeText('&quot;${l.id}&quot;:\\n  status: shortlist\\n  note: &quot;&quot;')">copy mark snippet</button>
        <span>${l.id}${map}${dup}</span>
      </div>
    </div></div>`;
}
document.querySelectorAll('#controls select, #controls input').forEach(e => e.addEventListener('input', draw));
draw();
</script>
</body>
</html>
